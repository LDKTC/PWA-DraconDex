<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/DraconDex-PWA/m/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="DraconDex - Novel data management app for organizing world-building data: characters, places, timelines, relationships, and free-form notes.">
  <meta name="theme-color" content="#6366F1">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="DraconDex">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>DraconDex</title>
  <link rel="manifest" href="../manifest.webmanifest">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
  // The site's service worker — see tools/sw-register.mjs for why it is
  // registered this early and why the page reports what it loaded.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('../sw.js', { scope: '../' }).then(function () {
      return navigator.serviceWorker.ready;
    }).then(function (reg) {
      function report() {
        if (!reg.active) return;
        var urls = performance.getEntriesByType('resource').map(function (e) { return e.name; });
        urls.push(location.href);
        reg.active.postMessage({ type: 'cache-loaded', urls: urls });
      }
      if (document.readyState === 'complete') report(); else addEventListener('load', report);
      addEventListener('flutter-first-frame', report);
    }).catch(function (e) { console.warn('[sw]', e); });
  }
</script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
